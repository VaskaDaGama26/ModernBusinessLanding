<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/images/fav-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Landing Page using HTML, CSS, JS and Framer Motion</title>
    <link rel="stylesheet" src="/styles/style.css" />
  </head>
  <body>
    <main style="position: relative; min-height: 100vh; overflow-x: hidden">
      <div
        style="
          position: absolute;
          top: -112px;
          left: -112px;
          width: 500px;
          height: 500px;
          border-radius: 999px;
          z-index: -10;
          background-image: linear-gradient(
            to top right in oklab,
            oklch(0.585 0.233 277.117 / 20%),
            oklch(65.6% 0.241 354.308 / 20%)
          );
          filter: blur(80px);
        "
      >
        <div style="overflow: hidden"></div>
      </div>
    </main>
  </body>
</html>
